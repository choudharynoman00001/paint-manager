<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paint Manager</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
:root{
  --bg:#0e1116; --panel:#171c24; --panel2:#1f2630; --panel3:#242d3a;
  --border:#2a3340; --ink:#e8ecf1; --muted:#9aa6b2; --faint:#6b7684;
  --accent:#f5a623; --accent-dk:#c77f0a; --green:#3ecf8e; --red:#ff5c5c; --blue:#4da3ff;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=color]{padding:2px;height:40px;cursor:pointer}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px 2px;text-transform:uppercase;letter-spacing:.04em}

#app{display:flex;flex-direction:column;height:100vh;max-width:1400px;margin:0 auto}
.topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:36px;height:36px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent) 0%,#e25822 100%);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#1a1206;font-size:19px}
.brand h1{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{font-size:11px;color:var(--faint);white-space:nowrap}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px;border:1px solid transparent}
.tab:hover{color:var(--ink);background:var(--panel2)}
.tab.active{color:var(--accent);background:rgba(245,166,35,.1);border-color:rgba(245,166,35,.35)}
.tab .badge{position:relative;top:-1px;margin-left:5px;background:var(--red);color:#fff;border-radius:99px;padding:1px 7px;font-size:11px;font-weight:700}

.content{flex:1;overflow-y:auto;padding:16px 18px 90px}
.footerbar{
  padding:8px 18px;text-align:center;font-size:11px;color:var(--faint);
  border-top:1px solid var(--border);background:var(--panel);letter-spacing:.03em;
}

/* ---------- generic ---------- */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.row{display:flex;gap:10px;align-items:center}
.grid{display:grid;gap:14px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 18px;border-radius:9px;font-weight:700;font-size:14px;
  background:var(--panel3);border:1px solid var(--border);color:var(--ink);
  min-height:44px;transition:filter .12s;
}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--accent);border-color:var(--accent-dk);color:#1a1206}
.btn.green{background:var(--green);border-color:#2aa56d;color:#06281a}
.btn.red{background:rgba(255,92,92,.12);border-color:rgba(255,92,92,.4);color:var(--red)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 12px;min-height:34px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.chip.green{background:rgba(62,207,142,.14);color:var(--green)}
.chip.red{background:rgba(255,92,92,.14);color:var(--red)}
.chip.amber{background:rgba(245,166,35,.14);color:var(--accent)}
.chip.blue{background:rgba(77,163,255,.14);color:var(--blue)}
.muted{color:var(--muted)} .small-txt{font-size:13px}
.swatch{width:22px;height:22px;border-radius:6px;border:1px solid rgba(255,255,255,.25);flex:0 0 auto;display:inline-block;vertical-align:middle}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;min-width:0}
.stat-card .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat-card .v{font-size:22px;font-weight:800;margin-top:4px}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid rgba(42,51,64,.55);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.clickable{cursor:pointer}
.tbl tr.clickable:hover td{background:rgba(255,255,255,.03)}
tr.low td{background:rgba(255,92,92,.06)}
.empty{padding:38px 16px;text-align:center;color:var(--faint)}
.search-row{margin-bottom:12px}
hr.sep{border:none;border-top:1px solid var(--border);margin:12px 0}

/* ---------- bill tab ---------- */
.bill-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;align-items:start}
.stock-pick{max-height:calc(100vh - 250px);overflow-y:auto}
.pick-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:9px;border:1px solid transparent}
.pick-row:hover{background:var(--panel2);border-color:var(--border)}
.pick-row.out{opacity:.4}
.pick-row .nm{font-weight:600;font-size:14px}
.pick-row .dt{font-size:12px;color:var(--muted)}
.pick-row .pr{margin-left:auto;text-align:right;font-weight:700;white-space:nowrap}
.pick-row .pr .q{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.pick-row .pr .q.low{color:var(--red)}
.cart-line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid rgba(42,51,64,.55)}
.cart-line .nm{font-weight:600;font-size:14px}
.cart-line .dt{font-size:12px;color:var(--muted)}
.cart-line .ctrls{display:flex;align-items:center;gap:6px;grid-column:1/-1;flex-wrap:wrap}
.qty-btn{width:34px;height:34px;border-radius:8px;background:var(--panel3);border:1px solid var(--border);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
.rate-input{width:100px;padding:6px 8px;text-align:right}
.line-total{margin-left:auto;font-weight:700;min-width:90px;text-align:right}
.rm{color:var(--red);font-size:18px;padding:4px 8px}
.totals{margin-top:12px;font-size:14px}
.totals .trow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;gap:10px}
.totals .grand{font-size:20px;font-weight:800;border-top:1px solid var(--border);margin-top:8px;padding-top:10px}
.totals .grand .amt{color:var(--accent)}
.disc-input{width:120px;padding:6px 8px;text-align:right}
.pay-toggle{display:flex;gap:8px;margin:14px 0 10px}
.pay-toggle button{flex:1;padding:12px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);font-weight:700;color:var(--muted)}
.pay-toggle button.on-cash{background:rgba(62,207,142,.15);border-color:var(--green);color:var(--green)}
.pay-toggle button.on-udh{background:rgba(245,166,35,.15);border-color:var(--accent);color:var(--accent)}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(5,8,12,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:20px}
.modal h2{font-size:17px;margin-bottom:14px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.swatch-presets{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.swatch-presets button{width:30px;height:30px;border-radius:8px;border:2px solid transparent}
.swatch-presets button.sel{border-color:#fff}

/* ---------- receipt ---------- */
.receipt{background:#fff;color:#111;border-radius:10px;padding:18px 16px;font-family:"Courier New",monospace;font-size:13px;max-width:340px;margin:0 auto}
.receipt h3{text-align:center;font-size:16px;font-family:"Segoe UI",system-ui,sans-serif}
.receipt .rc{text-align:center;color:#444;font-size:12px}
.receipt table{width:100%;border-collapse:collapse;margin:8px 0}
.receipt th{border-bottom:1px dashed #999;text-align:left;font-size:12px;padding:3px 0}
.receipt td{padding:3px 0;font-size:12px;vertical-align:top}
.receipt .rt{border-top:1px dashed #999;font-weight:700}
.receipt .right{text-align:right;white-space:nowrap}
.receipt .foot{text-align:center;font-size:11px;color:#555;margin-top:10px;border-top:1px dashed #999;padding-top:8px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--panel3);border:1px solid var(--border);border-radius:10px;padding:11px 18px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:tin .18s ease-out}
.toast.ok{border-color:var(--green);color:var(--green)}
.toast.err{border-color:var(--red);color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- customers ---------- */
.cust-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);cursor:pointer;width:100%;text-align:left}
.cust-card:hover{border-color:var(--accent)}
.cust-card .av{width:40px;height:40px;border-radius:50%;background:var(--panel3);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent);flex:0 0 auto}
.ledger-row{display:flex;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px solid rgba(42,51,64,.55);font-size:14px}
.ledger-row:last-child{border-bottom:none}

@media print{
  body{background:#fff}
  #app,.topbar,.footerbar,.modal-back .modal .actions,#toast,.no-print{display:none !important}
  .modal-back{position:static;background:none;padding:0;display:block}
  .modal{border:none;max-width:none;max-height:none;overflow:visible;padding:0;background:#fff}
  .receipt{max-width:76mm;box-shadow:none}
}
@media (max-width:900px){
  .bill-grid{grid-template-columns:1fr}
  .stock-pick{max-height:300px}
}
@media (max-width:720px){
  .tabs{margin-left:0;width:100%}
  .tab{flex:1;text-align:center;padding:8px 4px;font-size:13px}
  .form-grid{grid-template-columns:1fr}
  .content{padding:12px 12px 90px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<script>
"use strict";
/* ================= Paint Manager - offline POS ================= */
const DB_KEY = 'paintManager.v1';

const BRANDS = ['Brighto','Master Paints','Nippon','Berger','Diamond Paints','Gobis'];
const TYPES  = ['Plastic Emulsion','Wall Emulsion','Enamel (Gloss)','Weather Shield','Primer (Undercoat)','Distemper','Wall Putty','Thinner'];
const SIZES  = ['Quarter (0.91 L)','1 Litre','Gallon (3.64 L)','Drum (16 L)','5 kg','20 kg'];
const PRESET_COLOURS = [
  {name:'White',hex:'#f4f4ee'},{name:'Off White',hex:'#f0ead8'},{name:'Magnolia',hex:'#f2e2c4'},
  {name:'Cream',hex:'#f3e0b8'},{name:'Lemon Yellow',hex:'#f5d54a'},{name:'Sky Blue',hex:'#a8cbe8'},
  {name:'Sea Green',hex:'#9fd3b4'},{name:'Rose Pink',hex:'#eab5c0'},{name:'Peach',hex:'#f2c9a4'},
  {name:'Grey',hex:'#b9bdc2'},{name:'Black',hex:'#2a2a2a'},{name:'Red Oxide',hex:'#8a3b2e'}
];

function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(n){ n = Math.round(Number(n)||0); return 'Rs ' + n.toLocaleString('en-US'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDT(ts){ const d=new Date(ts); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) + ' ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }

function seedItems(){
  const S = [
    ['Brighto','Plastic Emulsion','White','#f4f4ee','Gallon (3.64 L)',12,6300,7200],
    ['Brighto','Plastic Emulsion','White','#f4f4ee','Drum (16 L)',6,21500,24000],
    ['Brighto','Plastic Emulsion','Off White','#f0ead8','Gallon (3.64 L)',8,6300,7200],
    ['Brighto','Enamel (Gloss)','White','#f4f4ee','Gallon (3.64 L)',6,7800,8900],
    ['Brighto','Enamel (Gloss)','Black','#2a2a2a','Quarter (0.91 L)',10,2100,2450],
    ['Master Paints','Weather Shield','White','#f4f4ee','Gallon (3.64 L)',5,8500,9700],
    ['Master Paints','Plastic Emulsion','Magnolia','#f2e2c4','Gallon (3.64 L)',7,6400,7300],
    ['Master Paints','Primer (Undercoat)','White','#f4f4ee','Gallon (3.64 L)',9,5400,6200],
    ['Nippon','Plastic Emulsion','White','#f4f4ee','Gallon (3.64 L)',6,6900,7900],
    ['Nippon','Weather Shield','White','#f4f4ee','Gallon (3.64 L)',4,9200,10500],
    ['Berger','Plastic Emulsion','White','#f4f4ee','Gallon (3.64 L)',6,6600,7550],
    ['Berger','Wall Emulsion','Off White','#f0ead8','Gallon (3.64 L)',5,6800,7750],
    ['Berger','Primer (Undercoat)','White','#f4f4ee','Gallon (3.64 L)',6,5600,6400],
    ['Diamond Paints','Plastic Emulsion','White','#f4f4ee','Gallon (3.64 L)',10,5900,6800],
    ['Diamond Paints','Enamel (Gloss)','White','#f4f4ee','1 Litre',14,1950,2300],
    ['Gobis','Wall Putty','White','#f4f4ee','20 kg',15,1650,1950],
    ['Gobis','Wall Putty','White','#f4f4ee','5 kg',12,480,580],
    ['Local','Thinner','Clear','#dfe8ee','Gallon (3.64 L)',18,1400,1700],
    ['Local','Thinner','Clear','#dfe8ee','1 Litre',24,380,460],
    ['Brighto','Distemper','White','#f4f4ee','20 kg',8,2900,3400]
  ];
  return S.map(r => ({ id:uid('i'), brand:r[0], type:r[1], colour:r[2], hex:r[3], size:r[4], qty:r[5], buy:r[6], sell:r[7], low:5 }));
}

function defaultState(){
  return {
    settings:{ shopName:'Paint Store', phone:'', address:'', footer:'DEVELOPER BY CHAUDHRY NOMAN · POWERED BY ALPHA BLUE DIGITAL' },
    items:seedItems(), customers:[], bills:[], payments:[], cart:[],
    seq:{ bill:1001 }, seededAt:Date.now()
  };
}

let state;
try {
  const raw = localStorage.getItem(DB_KEY);
  state = raw ? JSON.parse(raw) : defaultState();
  if(!state.items) state = defaultState();
} catch(e){ state = defaultState(); }
function save(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(state)); }catch(e){ toast('Save nahi hua: storage full', 'err'); } }
if(!localStorage.getItem(DB_KEY)) save();

let ui = { tab:'bill', stockQ:'', pickQ:'', reportRange:'today', openCustomer:null };

/* ---------- toast ---------- */
function toast(msg, kind){
  const box = document.getElementById('toast');
  while(box.children.length >= 2) box.firstChild.remove();
  const t = document.createElement('div');
  t.className = 'toast ' + (kind||'');
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),320); }, 3000);
}

/* ---------- modal ---------- */
function openModal(html){ document.getElementById('modal-root').innerHTML = '<div class="modal-back" data-action="modal-back"><div class="modal">'+html+'</div></div>'; }
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

/* ---------- business helpers ---------- */
function itemById(id){ return state.items.find(i=>i.id===id); }
function custById(id){ return state.customers.find(c=>c.id===id); }
function itemName(it){ return it.brand+' '+it.type+' '+it.colour; }
function custBalance(cid){
  const bills = state.bills.filter(b=>b.customerId===cid && b.payType==='udhaar').reduce((s,b)=>s+b.total,0);
  const pays  = state.payments.filter(p=>p.customerId===cid).reduce((s,p)=>s+p.amount,0);
  return bills - pays;
}
function cartTotal(){
  const sub = state.cart.reduce((s,l)=>s + l.rate*l.qty, 0);
  const disc = Math.min(Math.max(Number(state.cartDiscount)||0,0), sub);
  return { sub, disc, total: sub - disc };
}
function lowStockCount(){ return state.items.filter(i=>i.qty <= (i.low||5)).length; }

/* ================= renders ================= */
function render(){
  const low = lowStockCount();
  document.getElementById('app').innerHTML =
    '<div class="topbar">' +
      '<div class="brand"><div class="logo">P</div><div><h1>'+esc(state.settings.shopName)+'</h1><div class="sub">Paint Manager · '+esc(todayStr())+'</div></div></div>' +
      '<div class="tabs">' +
        tabBtn('bill','Bill') +
        '<button class="tab'+(ui.tab==='stock'?' active':'')+'" data-action="nav" data-tab="stock">Maal'+(low? '<span class="badge">'+low+'</span>':'')+'</button>' +
        tabBtn('udhaar','Udhaar') +
        tabBtn('report','Report') + tabBtn('settings','Settings') +
      '</div>' +
    '</div>' +
    '<div class="content" id="content">' +
      (ui.tab==='bill' ? renderBill() :
       ui.tab==='stock' ? renderStock() :
       ui.tab==='udhaar' ? renderUdhaar() :
       ui.tab==='report' ? renderReport() : renderSettings()) +
    '</div>' +
    '<div class="footerbar">'+esc(state.settings.footer)+' · ALL RIGHTS RESERVED 2026</div>';
}
function tabBtn(id,label){ return '<button class="tab'+(ui.tab===id?' active':'')+'" data-action="nav" data-tab="'+id+'">'+label+'</button>'; }

/* ---------- Bill ---------- */
function renderBill(){
  const q = ui.pickQ.toLowerCase();
  const list = state.items.filter(i => !q || (itemName(i)+' '+i.size).toLowerCase().includes(q));
  const picks = list.map(it => {
    const out = it.qty<=0, lowQ = it.qty <= (it.low||5);
    return '<button class="pick-row'+(out?' out':'')+'" data-action="add-line" data-id="'+it.id+'" '+(out?'disabled':'')+'>' +
      '<span class="swatch" style="background:'+esc(it.hex)+'"></span>' +
      '<span><span class="nm">'+esc(itemName(it))+'</span><br><span class="dt">'+esc(it.size)+'</span></span>' +
      '<span class="pr">'+fmt(it.sell)+'<span class="q'+(lowQ?' low':'')+'">stock: '+it.qty+'</span></span>' +
    '</button>';
  }).join('') || '<div class="empty">Koi item nahi mila. Maal tab mein naya item add karein.</div>';

  const lines = state.cart.map((l,idx) => {
    const it = itemById(l.itemId);
    return '<div class="cart-line">' +
      '<div><div class="nm">'+esc(l.name)+'</div><div class="dt">'+esc(l.size)+(it? ' · stock: '+it.qty : '')+'</div></div>' +
      '<button class="rm" data-action="rm-line" data-idx="'+idx+'" title="Hatao">×</button>' +
      '<div class="ctrls">' +
        '<button class="qty-btn" data-action="qty" data-idx="'+idx+'" data-d="-1">−</button>' +
        '<b style="min-width:30px;text-align:center">'+l.qty+'</b>' +
        '<button class="qty-btn" data-action="qty" data-idx="'+idx+'" data-d="1">+</button>' +
        '<input class="rate-input" type="number" min="0" step="1" value="'+l.rate+'" data-field="line-rate" data-idx="'+idx+'" title="Rate">' +
        '<span class="line-total">'+fmt(l.rate*l.qty)+'</span>' +
      '</div>' +
    '</div>';
  }).join('');

  const t = cartTotal();
  const payType = state.cartPayType || 'cash';
  const custOpts = state.customers.map(c=>'<option value="'+c.id+'"'+(state.cartCustomerId===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('');

  return '<div class="bill-grid">' +
    '<div class="panel"><div class="search-row"><input placeholder="Item dhoondo: brand, type, colour, size..." value="'+esc(ui.pickQ)+'" data-field="pick-q"></div>' +
      '<div class="stock-pick">'+picks+'</div></div>' +
    '<div class="panel"><h2 style="font-size:16px;margin-bottom:6px">Bill'+(state.cart.length? ' ('+state.cart.length+')':'')+'</h2>' +
      (state.cart.length ? lines : '<div class="empty">Cart khali hai.<br>Baen taraf se item chunein.</div>') +
      '<div class="totals">' +
        '<div class="trow"><span class="muted">Subtotal</span><b>'+fmt(t.sub)+'</b></div>' +
        '<div class="trow"><span class="muted">Discount (Rs)</span><input class="disc-input" type="number" min="0" step="1" value="'+(state.cartDiscount||'')+'" data-field="discount" placeholder="0"></div>' +
        '<div class="trow grand"><span>Total</span><span class="amt">'+fmt(t.total)+'</span></div>' +
      '</div>' +
      '<div class="pay-toggle">' +

/* ---------- Report ---------- */
function reportBills(){
  const now = new Date();
  return state.bills.filter(b => {
    if(ui.reportRange==='all') return true;
    const d = new Date(b.ts);
    if(ui.reportRange==='today') return todayStr(d)===todayStr(now);
    return (now - d) <= 7*24*3600*1000;
  }).sort((a,b)=>b.ts-a.ts);
}

/* ================= actions ================= */
function saveBill(){
  if(!state.cart.length){ toast('Cart khali hai','err'); return; }
  const t = cartTotal();
  const payType = state.cartPayType || 'cash';
  let cust = null;
  if(payType==='udhaar'){
    cust = custById(state.cartCustomerId);
    if(!cust){ toast('Udhaar ke liye customer chunein','err'); return; }
  }
  for(const l of state.cart){
    const it = itemById(l.itemId);
    if(it && l.qty > it.qty){ toast('Stock kam hai: '+itemName(it)+' ('+it.qty+' baqi)','err'); return; }
  }
  state.cart.forEach(l => { const it = itemById(l.itemId); if(it) it.qty = Math.max(0, it.qty - l.qty); });
  const bill = {
    id:uid('b'), no:state.seq.bill++, ts:Date.now(),
    customerId: cust? cust.id : null, customerName: cust? cust.name : '',
    lines: state.cart.map(l=>({name:l.name,size:l.size,qty:l.qty,rate:l.rate})),
    subtotal:t.sub, discount:t.disc, total:t.total, payType
  };
  state.bills.push(bill);
  state.cart = []; state.cartDiscount = 0; state.cartPayType='cash'; state.cartCustomerId='';
  save(); render();
  showReceipt(bill);
}

function exportCSV(){
  const bills = reportBills();
  const head = 'Bill No,Date,Customer,Items,Subtotal,Discount,Total,Type\n';
  const body = bills.map(b => [b.no, new Date(b.ts).toLocaleString('en-GB'), '"'+(b.customerName||'Walk-in').replace(/"/g,'""')+'"', b.lines.reduce((s,l)=>s+l.qty,0), b.subtotal, b.discount, b.total, b.payType].join(',')).join('\n');
  download('paint-manager-sales-'+todayStr()+'.csv', head+body, 'text/csv');
  toast('CSV download ho gaya','ok');
}
function download(name, content, mime){
  const blob = content instanceof Blob ? content : new Blob([content], {type:mime||'application/octet-stream'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

const actions = {
  'nav': el => { ui.tab = el.dataset.tab; ui.openCustomer = null; render(); },
  'modal-back': (el,ev) => { if(ev.target === el) closeModal(); },
  'close-modal': () => closeModal(),
  'print': () => window.print(),

  'add-line': el => {
    const it = itemById(el.dataset.id); if(!it) return;
    const ex = state.cart.find(l=>l.itemId===it.id);
    const inCart = ex ? ex.qty : 0;
    if(inCart + 1 > it.qty){ toast('Stock sirf '+it.qty+' hai','err'); return; }
    if(ex) ex.qty++;
    else state.cart.push({ itemId:it.id, name:itemName(it), size:it.size, qty:1, rate:it.sell });
    save(); render();
  },
  'rm-line': el => { state.cart.splice(Number(el.dataset.idx),1); save(); render(); },
  'qty': el => {
    const l = state.cart[Number(el.dataset.idx)]; if(!l) return;
    const it = itemById(l.itemId);
    const nq = l.qty + Number(el.dataset.d);
    if(nq < 1) return;
    if(it && nq > it.qty){ toast('Stock sirf '+it.qty+' hai','err'); return; }
    l.qty = nq; save(); render();
  },
  'pay-type': el => { state.cartPayType = el.dataset.t; save(); render(); },
  'save-bill': () => saveBill(),

  'new-item': () => openModal(itemFormHTML(null)),
  'edit-item': el => { const it = itemById(el.dataset.id); if(it) openModal(itemFormHTML(it)); },
  'preset-colour': el => {
    const n = document.getElementById('if-colour'), h = document.getElementById('if-hex');
    if(n) n.value = el.dataset.name; if(h) h.value = el.dataset.hex;

    if(!brand || !type || !size){ toast('Brand, type aur size lazmi hain','err'); return; }
    if(sell<=0){ toast('Sell rate lazmi hai','err'); return; }

      Object.assign(it, {brand,type,colour,hex,size,qty,buy,sell,low});
      toast('Item update ho gaya','ok');

      state.items.unshift({ id:uid('i'), brand,type,colour,hex,size,qty,buy,sell,low });

      '<input id="si-qty" type="number" min="1" step="1" value="1" autofocus>' +
      '<div class="actions"><button class="btn ghost" data-action="close-modal">Cancel</button>' +
      '<button class="btn green" data-action="stock-in-save" data-id="'+it.id+'">Stock Add</button></div>');
  },
  'stock-in-save': el => {
    const it = itemById(el.dataset.id); if(!it) return;
    const n = Math.max(0, Math.round(Number((document.getElementById('si-qty')||{}).value)||0));
    if(!n){ toast('Qty lazmi hai','err'); return; }
    it.qty += n; save(); closeModal(); render();
    toast('Stock ab '+it.qty+' hai','ok');
  },

  'new-cust': () => openModal('<h2>Naya Customer</h2><div class="form-grid">' +
    '<div><label>Naam</label><input id="nc-name" placeholder="Customer ka naam"></div>' +
    '<div><label>Phone</label><input id="nc-phone" placeholder="03xx-xxxxxxx"></div></div>' +
    '<div class="actions"><button class="btn ghost" data-action="close-modal">Cancel</button>' +
    '<button class="btn primary" data-action="save-cust">Save Customer</button></div>'),
  'save-cust': () => {
    const name = (document.getElementById('nc-name')||{}).value||'';
    const phone = (document.getElementById('nc-phone')||{}).value||'';
    if(!name.trim()){ toast('Naam lazmi hai','err'); return; }
    const c = { id:uid('c'), name:name.trim(), phone:phone.trim() };
    state.customers.push(c); state.cartCustomerId = c.id;
    save(); closeModal(); render(); toast('Customer add ho gaya','ok');
  },
  'open-cust': el => { ui.openCustomer = el.dataset.id; render(); },
  'back-cust': () => { ui.openCustomer = null; render(); },
  'add-payment': el => {
    const c = custById(el.dataset.id); if(!c) return;
    const amt = Math.round(Number((document.getElementById('pay-amount')||{}).value)||0);
    const note = ((document.getElementById('pay-note')||{}).value||'').trim();
    if(amt<=0){ toast('Amount lazmi hai','err'); return; }
    const bal = custBalance(c.id);
    state.payments.push({ id:uid('p'), ts:Date.now(), customerId:c.id, amount:amt, note });
    save(); render();
    toast('Wasooli save ho gayi'+(amt>bal?' (balance se zyada)':''),'ok');
  },

  'range': el => { ui.reportRange = el.dataset.r; render(); },
  'view-bill': el => { const b = state.bills.find(x=>x.id===el.dataset.id); if(b) showReceipt(b); },
  'export-csv': () => exportCSV(),
  'backup': () => { download('paint-manager-backup-'+todayStr()+'.json', JSON.stringify(state,null,2), 'application/json'); toast('Backup download ho gaya','ok'); },

  'save-settings': () => {
    state.settings.shopName = ((document.getElementById('set-name')||{}).value||'').trim() || 'Paint Store';
    state.settings.phone = ((document.getElementById('set-phone')||{}).value||'').trim();
    state.settings.address = ((document.getElementById('set-addr')||{}).value||'').trim();
    save(); render(); toast('Settings save ho gayi','ok');
  },
  'reset-all': () => {
    if(!confirm('Sab data delete kar ke DEMO maal wapas laayein?')) return;
    localStorage.removeItem(DB_KEY); location.reload();
  },
  'empty-start': () => {
    if(!confirm('SAB DATA (maal, bills, udhaar, customers) delete ho jayega. Pakka khali start?')) return;
    const s = defaultState();
    s.items = [];
    s.settings = state.settings;
    state = s; save(); render();
    toast('Khali start - ab apna maal add karein','ok');
  }
};

/* ---------- field listeners (input/change) ---------- */
function rerenderKeepFocus(sel, len){
  render();
  const el = document.querySelector(sel);
  if(el){ el.focus(); try{ el.setSelectionRange(len,len); }catch(e){} }
}
function updateTotalsDOM(){
  const t = cartTotal();
  const sub = document.querySelector('.totals .trow b');
  if(sub) sub.textContent = fmt(t.sub);
  const gr = document.querySelector('.totals .grand .amt');
  if(gr) gr.textContent = fmt(t.total);
  const sb = document.querySelector('[data-action="save-bill"]');
  if(sb) sb.textContent = 'Bill Save \u00b7 ' + fmt(t.total);
  document.querySelectorAll('.cart-line').forEach((el,i)=>{
    const lt = el.querySelector('.line-total');
    if(lt && state.cart[i]) lt.textContent = fmt(state.cart[i].rate*state.cart[i].qty);
  });
}
const inputFields = {
  'pick-q': v => { ui.pickQ = v; rerenderKeepFocus('[data-field="pick-q"]', v.length); },
  'stock-q': v => { ui.stockQ = v; rerenderKeepFocus('[data-field="stock-q"]', v.length); },
  'line-rate': (v,el) => { const l = state.cart[Number(el.dataset.idx)]; if(l){ l.rate = Math.max(0,Number(v)||0); save(); updateTotalsDOM(); } },
  'discount': v => { state.cartDiscount = Math.max(0,Number(v)||0); save(); updateTotalsDOM(); }
};
const changeFields = {
  'cart-cust': v => { state.cartCustomerId = v; save(); },
  'restore': (v,el) => {
    const f = el.files && el.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if(!d || !Array.isArray(d.items) || !Array.isArray(d.bills) || !Array.isArray(d.customers) || !Array.isArray(d.payments) || !d.settings || typeof d.settings.shopName !== 'string') throw new Error('bad file');
        state = d; save(); render();
        toast('Backup restore ho gaya: '+d.items.length+' items, '+d.bills.length+' bills','ok');
      }catch(e){ toast('Backup file theek nahi','err'); }
    };
    r.readAsText(f);
  }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]');
  if(!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if(fn){ ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('input', ev => {
  const el = ev.target.closest('[data-field]');
  if(!el) return;
  const fn = inputFields[el.dataset.field];
  if(fn) fn(el.value, el);
});
document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-field]');
  if(!el) return;
  const fn = changeFields[el.dataset.field];
  if(fn) fn(el.value, el);
});
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape') closeModal();
});

render();
</script>
</body>
</html>
